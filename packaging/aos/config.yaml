schemaVersion: 2

publisher:
  author: maninblack

publish:
  tlsKey: aos-user-sp.p12

items:
  - identity:
      type: service
      codename: brake-health-service
      title: Brake Health Service
      description: Diagnostic scaffold for on-board KUKSA brake-health analysis
    version: 0.1.0
    sourceFolder: service
    images:
      - sourceFolder: arm64
        archInfo:
          architecture: arm64
    configuration:
      workingDir: /
      cmd: /usr/bin/brake-health-service
      instances:
        minInstances: 1
        priority: 10
      quotas:
        cpuLimit: 250
        ramLimit: 16MiB
        storageLimit: 8MiB
        stateLimit: 1MiB
        tmpLimit: 8MiB
        noFileLimit: 64
        pidsLimit: 24
      resources:
        - name: kuksa
    dependencies: []
