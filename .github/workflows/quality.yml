name: Quality gates

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  static-gates:
    runs-on: ubuntu-latest
    steps:
      - name: Check out source
        uses: actions/checkout@93cb6efe18208431cddfb8368fd83d5badbf9bfd # v5.0.1
      - name: Discover and run unit tests
        run: python3 -m unittest discover -s tests -p 'test_*.py'
      - name: Check repository boundary and policy
        run: python3 tools/quality_gate.py
      - name: Check whitespace
        run: git diff --check

  reuse:
    runs-on: ubuntu-latest
    steps:
      - name: Check out source
        uses: actions/checkout@93cb6efe18208431cddfb8368fd83d5badbf9bfd # v5.0.1
      - name: Verify REUSE compliance
        uses: fsfe/reuse-action@676e2d560c9a403aa252096d99fcab3e1132b0f5 # v6
